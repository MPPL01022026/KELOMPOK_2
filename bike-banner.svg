<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bde7ff"/>
      <stop offset="100%" stop-color="#fff1f7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="220" rx="20" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="710" cy="55" r="28" fill="#ffd966">
    <animate attributeName="r" values="28;31;28" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.95">
    <g>
      <ellipse cx="0" cy="50" rx="34" ry="14"/><ellipse cx="22" cy="42" rx="22" ry="14"/><ellipse cx="-20" cy="44" rx="20" ry="12"/>
      <animateTransform attributeName="transform" type="translate" from="-80 0" to="900 0" dur="28s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="0" cy="95" rx="28" ry="11"/><ellipse cx="18" cy="88" rx="18" ry="11"/><ellipse cx="-16" cy="90" rx="16" ry="10"/>
      <animateTransform attributeName="transform" type="translate" from="-300 0" to="700 0" dur="38s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- title -->
  <text x="400" y="78" text-anchor="middle" font-family="'Comic Sans MS','Trebuchet MS',sans-serif" font-size="40" font-weight="bold" fill="#ff6fa5">
    Hazza Bike
    <animate attributeName="y" values="78;72;78" dur="2.4s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="104" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="15" fill="#5b6b8c">
    Digital Twin Pengelolaan Penyewaan Sepeda
  </text>

  <!-- floating hearts -->
  <g font-size="18" fill="#ff8fb8">
    <text x="250" y="140">♥
      <animate attributeName="y" values="140;110;140" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="560" y="135">♥
      <animate attributeName="y" values="135;100;135" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="3.6s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- road -->
  <rect x="0" y="182" width="800" height="38" fill="#9aa5b8"/>
  <rect x="0" y="182" width="800" height="5" fill="#7d889c"/>
  <g stroke="#ffffff" stroke-width="3" stroke-dasharray="26 22" stroke-linecap="round">
    <line x1="0" y1="203" x2="840" y2="203">
      <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="0.8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- bike (rides across) -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-150 0" to="900 0" dur="9s" repeatCount="indefinite"/>
    <g transform="translate(0,160)">
      <!-- bouncing body -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="0.5s" repeatCount="indefinite"/>
        <!-- frame -->
        <g stroke="#ff6fa5" stroke-width="4" stroke-linecap="round" fill="none">
          <line x1="30" y1="0" x2="62" y2="-28"/>
          <line x1="62" y1="-28" x2="96" y2="0"/>
          <line x1="62" y1="-28" x2="94" y2="-30"/>
          <line x1="30" y1="0" x2="96" y2="0"/>
          <line x1="94" y1="-30" x2="100" y2="0"/>
          <line x1="94" y1="-30" x2="106" y2="-40"/>
          <line x1="62" y1="-28" x2="58" y2="-38"/>
        </g>
        <!-- seat -->
        <rect x="50" y="-42" width="18" height="5" rx="2.5" fill="#5b6b8c"/>
        <!-- rider -->
        <circle cx="66" cy="-72" r="11" fill="#ffd9b8"/>
        <path d="M54 -76 Q66 -92 78 -76 Z" fill="#ff6fa5"/>
        <circle cx="70" cy="-72" r="1.8" fill="#333"/>
        <path d="M68 -67 Q72 -64 76 -67" stroke="#d9534f" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <circle cx="75" cy="-68" r="2.6" fill="#ff9fc0" opacity="0.8"/>
        <path d="M66 -62 L60 -42" stroke="#6c8cff" stroke-width="7" stroke-linecap="round"/>
        <path d="M66 -60 L96 -40" stroke="#ffd9b8" stroke-width="4" stroke-linecap="round"/>
        <path d="M60 -42 L72 -14" stroke="#4a5a85" stroke-width="5" stroke-linecap="round"/>
      </g>
      <!-- wheels -->
      <g>
        <circle cx="30" cy="0" r="22" fill="none" stroke="#3b4660" stroke-width="4"/>
        <g stroke="#9aa5b8" stroke-width="1.5">
          <line x1="30" y1="-20" x2="30" y2="20"/><line x1="10" y1="0" x2="50" y2="0"/>
          <line x1="16" y1="-14" x2="44" y2="14"/><line x1="16" y1="14" x2="44" y2="-14"/>
          <animateTransform attributeName="transform" type="rotate" from="0 30 0" to="360 30 0" dur="0.6s" repeatCount="indefinite"/>
        </g>
      </g>
      <g>
        <circle cx="100" cy="0" r="22" fill="none" stroke="#3b4660" stroke-width="4"/>
        <g stroke="#9aa5b8" stroke-width="1.5">
          <line x1="100" y1="-20" x2="100" y2="20"/><line x1="80" y1="0" x2="120" y2="0"/>
          <line x1="86" y1="-14" x2="114" y2="14"/><line x1="86" y1="14" x2="114" y2="-14"/>
          <animateTransform attributeName="transform" type="rotate" from="0 100 0" to="360 100 0" dur="0.6s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>
  </g>
</svg>
